  <title>CV | Soroush Haghi</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #eef0f3; color: #f7f8fa; }
    .shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 12px clamp(16px, 3.6vw, 52px); min-height: 74px; background: #0b0c0f; border-bottom: 1px solid #272a30; }
    .identity { display: flex; min-width: 0; align-items: center; gap: 13px; color: inherit; text-decoration: none; }
    .monogram { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid #62666e; border-radius: 12px; color: white; font-size: 16px; font-weight: 750; letter-spacing: -.06em; flex-shrink: 0; }
    .wordmark { min-width: 0; }
    .wordmark strong { display: block; font-size: 15px; letter-spacing: -.02em; white-space: nowrap; }
    .wordmark span { display: block; margin-top: 2px; color: #a3a6af; font-size: 11px; letter-spacing: .015em; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 9px; }
    .action { display: inline-flex; justify-content: center; align-items: center; gap: 6px; padding: 10px 14px; border: 1px solid #545862; border-radius: 9px; background: transparent; color: #f5f6f8; text-decoration: none; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .action:hover, .action:focus-visible { background: #22252b; border-color: #a1a5ae; }
    .action.primary { background: #f7f8fa; color: #111317; border-color: #f7f8fa; }
    .action.primary:hover, .action.primary:focus-visible { background: #dce0e5; }
    main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .reader { display: block; width: 100%; height: calc(100vh - 74px); height: calc(100dvh - 74px); min-height: 420px; border: 0; background: #eef0f3; }
    .fallback { display: none; margin: 0; padding: 12px 18px; background: #fff; color: #30363f; font-size: 13px; line-height: 1.5; }
    .fallback a { color: #1f4d89; }
    @media (max-width: 620px) {
      .topbar { padding: 11px 15px; gap: 10px; flex-wrap: wrap; min-height: 0; }
      .monogram { width: 37px; height: 37px; border-radius: 10px; font-size: 14px; }
      .wordmark strong { font-size: 14px; }
      .wordmark span { font-size: 10px; }
      .actions { width: 100%; justify-content: flex-start; gap: 7px; }
      .action { padding: 8px 11px; font-size: 12px; }
      .reader { min-height: 60vh; min-height: 60dvh; height: calc(100vh - 118px); height: calc(100dvh - 118px); }
      .fallback { display: block; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="identity" href="/" aria-label="Soroush Haghi — Back to portfolio">
        <span class="monogram" aria-hidden="true">SH</span>
        <span class="wordmark"><strong>Soroush Haghi</strong><span>Curriculum Vitae</span></span>
      </a>
      <nav class="actions" aria-label="CV actions">
        <a class="action" href="/">← Portfolio</a>
        <a class="action" href="./HAGHI_CV.pdf" target="_blank" rel="noopener">Open PDF ↗</a>
        <a class="action primary" href="./HAGHI_CV.pdf" download="Soroush_Haghi_CV.pdf">↓ Download CV</a>
      </nav>
    </header>
    <main id="content">
      <iframe class="reader" src="./HAGHI_CV.pdf#view=FitH" title="Soroush Haghi — Current Curriculum Vitae"></iframe>
      <p class="fallback">Having trouble viewing the CV on mobile? <a href="./HAGHI_CV.pdf" target="_blank" rel="noopener">Open the full PDF directly</a> or use Download CV above.</p>
    </main>
  </div>
</body>
</html>
