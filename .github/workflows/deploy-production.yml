name: Deploy Production Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build-and-publish-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        env:
          PUBLIC_URL: /
          REACT_APP_BASE_PATH: /
          REACT_APP_ENABLE_LAB: "false"
        run: npm run build

      - name: Add direct-route HTML fallbacks
        run: |
          for route in work education; do
            mkdir -p "build/$route"
            cp build/index.html "build/$route/index.html"
          done

      - name: Refresh semantic route fallbacks
        run: node scripts/generate-semantic-content.js

      - name: Publish production root while preserving redesign preview
        run: |
          cp -a build /tmp/production-build
          git fetch origin gh-pages
          git worktree add --detach /tmp/gh-pages origin/gh-pages
          cd /tmp/gh-pages

          # Preserve the redesign-preview subtree used for continued QA/lab work.
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name redesign-preview \
            -exec rm -rf {} +

          cp -a /tmp/production-build/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Production site is already current."
            exit 0
          fi

          git commit -m "Publish production redesign"
          git push origin HEAD:gh-pages
