<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0c0f" />
  <meta name="description" content="Read or download the complete current CV of Soroush Haghi." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="CV | Soroush Haghi" />
  <meta property="og:description" content="Current curriculum vitae and selected engineering experience." />
  <meta property="og:url" content="https://soroushhaghi.github.io/cv/" />
  <link rel="canonical" href="https://soroushhaghi.github.io/cv/" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261009" />
  <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg?v=20261009" />
  <link rel="apple-touch-icon" href="/favicon.svg?v=20261009" />
  <title>CV | Soroush Haghi</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; background: #eef0f3; color: #15191f; }
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px clamp(12px, 3vw, 44px); min-height: 66px; background: #0b0c0f; border-bottom: 1px solid #272a30; color: #f7f8fa; }
    .identity { display: flex; align-items: center; min-width: 0; gap: 11px; }
    .monogram { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid #62666e; border-radius: 11px; font-size: 15px; font-weight: 750; flex-shrink: 0; }
    .wordmark strong { display: block; font-size: 14px; letter-spacing: -.02em; white-space: nowrap; }
    .wordmark span { display: block; margin-top: 2px; color: #a3a6af; font-size: 11px; }
    .actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .action { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 9px 13px; border: 1px solid #62666e; border-radius: 9px; color: #f7f8fa; text-decoration: none; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .action:hover, .action:focus-visible { background: #25282f; border-color: #b4b9c1; }
    .action.primary { color: #111317; background: #f7f8fa; border-color: #f7f8fa; }
    .action.primary:hover, .action.primary:focus-visible { background: #dce0e5; }
    .action:focus-visible { outline: 3px solid #83bfff; outline-offset: 3px; }
    main { padding: 15px 0 32px; }
    .viewer { display: flex; flex-direction: column; align-items: center; gap: 16px; width: min(860px, calc(100% - 24px)); margin: 0 auto; }
    .paper { position: relative; flex: none; max-width: 100%; background: white; box-shadow: 0 3px 20px rgba(25, 34, 46, .16); overflow: hidden; }
    .paper canvas { display: block; max-width: 100%; height: auto; }
    .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; text-align: initial; }
    .textLayer span, .textLayer br { position: absolute; color: transparent; white-space: pre; cursor: text; transform-origin: 0 0; }
    .textLayer ::selection { background: rgba(50, 110, 210, .3); }
    .pdf-link { position: absolute; z-index: 2; display: block; background: transparent; }
    .pdf-link:focus-visible { outline: 2px solid #2776c7; background: rgba(39, 118, 199, .14); }
    .page-number { align-self: stretch; margin: -9px 0 5px; text-align: center; color: #656d78; font-size: 11px; }
    .status { margin: 35px auto; color: #414957; text-align: center; font-size: 14px; }
    @media (max-width: 620px) {
      .topbar { min-height: 60px; padding: 9px 10px; gap: 6px; }
      .monogram { width: 34px; height: 34px; border-radius: 9px; font-size: 12px; }
      .identity { gap: 7px; }
      .wordmark strong { font-size: 12px; }
      .wordmark span { font-size: 10px; }
      .actions { gap: 5px; }
      .action { min-height: 38px; padding: 7px 9px; font-size: 11px; }
      main { padding-top: 9px; }
      .viewer { width: calc(100% - 16px); gap: 13px; }
    }
    @media (max-width: 375px) {
      .wordmark span { display: none; }
      .monogram { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="identity" aria-label="Soroush Haghi — Curriculum Vitae">
      <span class="monogram" aria-hidden="true">SH</span>
      <span class="wordmark"><strong>Soroush Haghi</strong><span>Curriculum Vitae</span></span>
    </div>
    <nav class="actions" aria-label="CV actions">
      <a class="action" href="/" aria-label="Back to portfolio">← Back</a>
      <a class="action primary" href="./HAGHI_CV.pdf" download="Soroush_Haghi_CV.pdf">↓ Download CV</a>
    </nav>
  </header>
  <main>
    <div id="viewer" class="viewer" aria-label="Complete CV document">
      <p class="status" role="status">Loading the full CV…</p>
    </div>
    <noscript><p class="status">JavaScript is required for the page-by-page display. <a href="./HAGHI_CV.pdf">View the original PDF</a>.</p></noscript>
  </main>
  <!-- Render the actual published PDF, all pages, without relying on mobile iframe PDF plugins. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    (async function () {
      const pdfPath = "./HAGHI_CV.pdf";
      const viewer = document.getElementById("viewer");
      const pdfjs = window.pdfjsLib;
      // If the rendering library is unavailable, open the original PDF directly.
      if (!pdfjs) { window.location.replace(pdfPath); return; }
      pdfjs.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      let pdf;
      let generation = 0;
      let renderTask = null;
      let renderedWidth = 0;
      let resizeTimer;
      const redirectToOriginal = () => window.location.replace(pdfPath);

      async function renderAllPages() {
        const currentGeneration = ++generation;
        if (renderTask) renderTask.cancel();
        viewer.replaceChildren();
        const width = Math.floor(viewer.clientWidth);
        renderedWidth = width;

        try {
          for (let number = 1; number <= pdf.numPages; number++) {
            if (currentGeneration !== generation) return;
            const page = await pdf.getPage(number);
            if (currentGeneration !== generation) return;
            const natural = page.getViewport({ scale: 1 });
            const viewport = page.getViewport({ scale: width / natural.width });
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            const sheet = document.createElement("article");
            sheet.className = "paper";
            sheet.setAttribute("role", "group");
            sheet.setAttribute("aria-label", "CV page " + number + " of " + pdf.numPages);
            sheet.style.width = viewport.width + "px";
            sheet.style.height = viewport.height + "px";

            const canvas = document.createElement("canvas");
            canvas.width = Math.round(viewport.width * dpr);
            canvas.height = Math.round(viewport.height * dpr);
            canvas.style.width = viewport.width + "px";
            canvas.style.height = viewport.height + "px";
            sheet.appendChild(canvas);

            const context = canvas.getContext("2d", { alpha: false });
            if (!context) throw new Error("Canvas context is unavailable");
            renderTask = page.render({
              canvasContext: context,
              viewport,
              transform: [dpr, 0, 0, dpr, 0, 0]
            });
            await renderTask.promise;
            renderTask = null;
            if (currentGeneration !== generation) return;

            // A selectable text layer makes the full PDF useful beyond a screenshot.
            if (typeof pdfjs.renderTextLayer === "function") {
              try {
                const textLayer = document.createElement("div");
                textLayer.className = "textLayer";
                textLayer.style.setProperty("--scale-factor", String(viewport.scale));
                const text = await page.getTextContent();
                await pdfjs.renderTextLayer({
                  textContentSource: text,
                  container: textLayer,
                  viewport,
                  textDivs: []
                }).promise;
                if (currentGeneration !== generation) return;
                sheet.appendChild(textLayer);
              } catch (error) {
                console.warn("Optional PDF text layer unavailable:", error);
              }
            }

            // Preserve external hyperlinks from the actual PDF on top of each page.
            const annotations = await page.getAnnotations({ intent: "display" });
            for (const annotation of annotations) {
              if (annotation.subtype !== "Link" || !annotation.rect) continue;
              const href = annotation.url;
              if (typeof href !== "string" || !/^https?:\/\//i.test(href)) continue;
              const rect = viewport.convertToViewportRectangle(annotation.rect);
              const x = Math.min(rect[0], rect[2]);
              const y = Math.min(rect[1], rect[3]);
              const link = document.createElement("a");
              link.className = "pdf-link";
              link.href = href;
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              link.setAttribute("aria-label", "Open CV reference");
              link.style.left = x + "px";
              link.style.top = y + "px";
              link.style.width = Math.abs(rect[2] - rect[0]) + "px";
              link.style.height = Math.abs(rect[3] - rect[1]) + "px";
              sheet.appendChild(link);
            }
            if (currentGeneration !== generation) return;
            viewer.appendChild(sheet);

            const caption = document.createElement("p");
            caption.className = "page-number";
            caption.textContent = "Page " + number + " of " + pdf.numPages;
            viewer.appendChild(caption);
          }
        } catch (error) {
          if (currentGeneration !== generation) return;
          console.error("CV viewer failed; opening original PDF:", error);
          redirectToOriginal();
        }
      }

      try {
        pdf = await pdfjs.getDocument({ url: pdfPath }).promise;
        await renderAllPages();
        window.addEventListener("resize", function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            if (Math.abs(viewer.clientWidth - renderedWidth) > 3) renderAllPages();
          }, 180);
        });
      } catch (error) {
        console.error("Could not load CV; opening original PDF:", error);
        redirectToOriginal();
      }
    })();
  </script>
</body>
</html>
