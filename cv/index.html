<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b1020" />
  <title>CV | Soroush Haghi</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f4f7ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 15%, rgba(74, 144, 226, 0.18), transparent 34rem),
        #0b1020;
    }
    main {
      width: min(100%, 640px);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      background: rgba(17, 25, 48, .78);
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
    }
    p {
      margin: 0 0 12px;
      color: #aebbd6;
      font-size: 1rem;
      line-height: 1.7;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.05;
      letter-spacing: -.04em;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      color: #8bc4ff;
      font-weight: 650;
      text-underline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <p>Soroush Haghi</p>
    <h1>Curriculum Vitae</h1>
    <p>The current CV will be available at this permanent address shortly.</p>
    <a href="/">Back to portfolio</a>
  </main>
</body>
</html>
